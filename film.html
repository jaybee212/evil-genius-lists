<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film Villains: The List of Lists</title>
<link rel="stylesheet" href="https://use.typekit.net/rpv1eay.css">
<style>
/* Layout idea: the same reference-ledger look as the main List of Lists; a consensus table on top, sources and the access log beneath. */
:root{--paper:#ffffff;--ink:#111111;--muted:#5b5b5b;--rule:#dcdcdc;--accent:#c8102e;--chip:#ececec;--row:#f7f7f7;
--display:"hoefler-text","Hoefler Text",Georgia,"Times New Roman",serif;--body:"gotham","Gotham","Helvetica Neue",Arial,sans-serif;--mono:var(--body);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111111;--ink:#f2f2f2;--muted:#a3a3a3;--rule:#2e2e2e;--accent:#e8344f;--chip:#262626;--row:#181818;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#111111;--ink:#f2f2f2;--muted:#a3a3a3;--rule:#2e2e2e;--accent:#e8344f;--chip:#262626;--row:#181818;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:32px clamp(16px,4vw,40px) 64px}
header{display:grid;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:20px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,54px);line-height:1.03;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:40px 0 8px;text-wrap:balance}
.lede{max-width:70ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:6px}
.stat .n{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;display:block;line-height:1}
.stat .l{font-size:13px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 12px}
.tabs button{font:inherit;cursor:pointer;background:var(--chip);color:var(--ink);border:1px solid transparent;border-radius:3px;padding:7px 12px}
.tabs button .c{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs button[aria-pressed="true"] .c{color:var(--paper);opacity:.75}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.desc{color:var(--muted);font-size:14px;max-width:80ch;margin:0 0 12px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.controls input{font:inherit;color:var(--ink);background:var(--row);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;flex:1 1 240px}
.tablebox{overflow-x:auto;border-top:1px solid var(--rule)}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.pos{font-family:var(--display);font-size:18px;font-weight:400;width:3.5em}
td.name{font-weight:600}
td.name .film{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:1px}
td.ment{min-width:200px}td.ment summary{color:var(--ink);font-size:14px}td.ment summary b{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;min-width:80px;position:relative;margin-top:7px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.where{font-size:13px;color:var(--muted);margin-top:4px;max-width:70ch}
.more{margin-top:10px;font:inherit;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:7px 12px}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 24px;margin-top:10px}
.src{border-top:1px solid var(--rule);padding-top:8px}
.src a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--rule)}
.src a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.src .meta{font-size:13px;color:var(--muted)}
.tag{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:var(--chip);padding:1px 6px;border-radius:2px;margin-left:6px}
.log{display:grid;gap:6px;margin-top:8px}
.log div{border-left:3px solid var(--accent);padding:4px 10px;background:var(--row)}
.log div.soft{border-left-color:var(--muted)}
.log b{font-weight:600}
.note{font-size:14px;color:var(--muted);max-width:78ch}
.viz{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:28px 40px;margin-top:12px}
.chart h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 2px}
.chart .sub{font-size:13px;color:var(--muted);margin:0 0 10px;max-width:60ch}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;align-items:center;gap:4px 10px;font-size:14px}
.hb .lab{text-align:right;line-height:1.25}
.hb .trk{position:relative;height:16px;cursor:default}
.hb .trk i{position:absolute;left:0;top:2px;bottom:2px;background:var(--ink);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--ink)}
.hb .row{display:contents}
.hb .row:hover .lab,.hb .row:focus-within .lab{text-decoration:underline}
.cols{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid var(--rule);padding-top:18px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.cols .c i{width:72%;background:var(--ink);border-radius:4px 4px 0 0;display:block}
.cols .c span{font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:3px}
.cols .c:hover i{opacity:.8}
.clabs{display:flex;gap:2px;font-size:11.5px;color:var(--muted);margin-top:4px}.clabs span{flex:1;text-align:center}
.tier{font-size:13px;color:var(--muted);margin-top:8px}.tier b{color:var(--ink);font-weight:600}
.chart details{margin-top:8px;font-size:13px}.chart details summary{cursor:pointer;color:var(--muted)}
.chart details table{width:100%;border-collapse:collapse;margin-top:6px}.chart details td{padding:3px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
#tip{position:fixed;pointer-events:none;z-index:9;max-width:320px;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hb .trk i.hi,.cols .c i.hi{background:var(--accent)}
#tip b{display:block;margin-bottom:3px}
.flag{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--muted);color:var(--muted);padding:0 5px;border-radius:2px;margin-left:6px;vertical-align:3px}

/* phones: stack the main table rows */
@media (max-width:600px){
 .tablebox{overflow-x:visible}
 .tablebox thead{display:none}
 .tablebox tbody tr{display:grid;grid-template-columns:2.4em 1fr;column-gap:8px;padding:10px 0;border-bottom:1px solid var(--rule)}
 .tablebox tbody td{border:0;padding:0}
 .tablebox td.pos{grid-row:1/3;font-size:15px}
 .tablebox td.num{display:none}
 .tablebox td.ment{grid-column:2;min-width:0;margin-top:4px}
 .tablebox td.ment .bar{max-width:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.srclist summary{font-size:14px;margin-top:6px}
.dwrap{display:flex;align-items:center;gap:20px;margin-top:6px}
.dsvg{width:150px;height:150px;flex:none}
.dbig{font-family:var(--body);font-weight:500;font-size:27px;fill:var(--ink);letter-spacing:-.01em}
.dsm{font-family:var(--body);font-size:9.5px;letter-spacing:.12em;fill:var(--muted)}
.dleg{list-style:none;margin:0;padding:0;font-size:13.5px;flex:1;min-width:0}
.dleg li{display:flex;align-items:center;gap:8px;padding:4px 0}
.dleg i{width:11px;height:11px;border-radius:2px;flex:none}
.dleg b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:8px}
@media (max-width:360px){.dsvg{width:116px;height:116px}.dwrap{gap:12px}.dleg{font-size:12.5px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Film Villains: The List of Lists</h1>
  <div class="stats" id="stats"></div>
</header>

<div class="tabs" id="tabs" role="group" aria-label="Choose a table"></div>
<p class="desc" id="desc" style="display:none"></p>
<p class="desc" id="tie" style="display:none"></p>

<div class="tablebox"><table>

  <tbody id="rows"></tbody>
</table></div>
<button class="more" id="more" type="button">Show all</button>

<h2 id="insights">Analysis</h2>
<div class="viz" id="viz"></div>
<div id="tip" role="tooltip"></div>

io": "United Artists", "genre": "Western", "archetype": "Enforcer", "killer": "Killer", "power": "No superpower"}}, "par": {"MGM": "MGM / United Artists", "United Artists": "MGM / United Artists", "MGM/UA": "MGM / United Artists", "TriStar": "Columbia / TriStar", "Columbia": "Columbia / TriStar", "Fox Searchlight": "20th Century Fox", "Paramount Vantage": "Paramount"}};
const G=[["general","Top 100","Every general-purpose film villain list used, ranked or not: polls, critics' surveys and editors' lists. Genre lists (Disney, Bond, horror, female and so on) are not used."],
["polls","Polls only","Only the lists decided by a vote: AFI (industry panel), OFCS and the Hollywood Reporter (industry and critics), and the public votes of Empire readers, Best Offers Bingo's UK survey, TheJournal.ie readers, Only Movies (top 5 only), Ranker and TheTopTens."]];
let g="general",q="",all=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=A.lists;
function short(i){const x=L[i];return x?x.p.replace(/ \(.*\)/,""):i}
const used=Object.keys(L).length;
const nEntries=Object.values(L).reduce((s,x)=>s+x.n,0);
document.getElementById("stats").innerHTML=[[used,"lists used"],[nEntries,"entries"],[A.tallies.general.length,"different villains"]].map(([n,l])=>`<div class="stat"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("");
const tabs=document.getElementById("tabs");
G.forEach(([k,l])=>{const b=document.createElement("button");b.type="button";b.dataset.k=k;b.innerHTML=`${l}<span class="c">${A.groups[k].filter(i=>L[i]).length}</span>`;b.addEventListener("click",()=>{g=k;all=false;render()});tabs.appendChild(b)});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.toLowerCase();render()});
document.getElementById("more").addEventListener("click",()=>{all=!all;render()});
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===g));
  document.getElementById("desc").textContent=G.find(x=>x[0]===g)[2];
  {const T=A.tallies[g];const c=g==="general"&&T.length>100?T[99].apps:null;const idx=c?T.map((o,i)=>o.apps===c?i+1:0).filter(Boolean):[];document.getElementById("tie").textContent=c&&idx.at(-1)>100?`The cut-off falls inside a tie: places ${idx[0]}–${idx.at(-1)} all have ${c} mentions, so rank score decides who makes the 100.`:"";}
  const T=A.tallies[g];const max=Math.max(...T.map(o=>o.score));
  let rows=T.map((o,i)=>({...o,pos:i+1}));
  if(q) rows=rows.filter(o=>o.name.toLowerCase().includes(q));
  const lim=all||q?rows.length:(g==="general"?100:50);
  document.getElementById("rows").innerHTML=rows.slice(0,lim).map(o=>`<tr><td class="pos">${o.pos}</td><td class="name">${esc(o.name)}${TR[o.name]?`<span class="film">${esc(TR[o.name].film)} (${TR[o.name].year})</span>`:""}</td><td class="ment"><details><summary><b>${o.apps}</b> list${o.apps>1?"s":""}</summary><div class="where">${o.where.slice().sort((x,y)=>(x[1]||999)-(y[1]||999)).map(([i,r])=>`${esc(short(i))} ${r?"#"+r:"(unranked)"}`).join(" · ")}</div></details><div class="bar"><i style="width:${(o.apps/T[0].apps*100).toFixed(1)}%"></i></div></td><td class="num">${o.score.toFixed(2)}</td><td class="num">${o.tops||""}</td><td class="num">${o.top10||""}</td></tr>`).join("")||`<tr><td colspan="6" style="color:var(--muted)">No villain by that name in this table.</td></tr>`;
  const m=document.getElementById("more");const base=g==="general"?100:50;m.style.display=(q||rows.length<=base)?"none":"inline-block";m.textContent=all?`Show top ${base}`:`Show all ${rows.length}`;
}
const gOf=i=>{for(const [k] of G){if(k!=="polls"&&A.groups[k].includes(+i))return G.find(x=>x[0]===k)[1]}return "Partial"};
document.getElementById("srcsum").textContent=`Show all ${Object.keys(L).length} lists`;
document.getElementById("srcs").innerHTML=Object.values(L).sort((x,y)=>x.p.localeCompare(y.p)).map(x=>`<div class="src"><b>${esc(x.t)}</b><div class="meta">${esc(x.p)}${x.y?" · "+esc(x.y):""} · ${x.n} entries${A.polls.includes(x.id)?" · poll":""}${ACC.site.some(s=>s[0]===x.id)?" · partial":""}${x.entries.every(e=>e[1]===null)?" · unranked":""}</div></div>`).join("");
// ---- Insights ----
const TOP=A.tallies.general.slice(0,100).map((o,i)=>({...o,pos:i+1,...(TR[o.name]||{})}));
const tip=document.getElementById("tip");
function showTip(e,title,list){tip.innerHTML=`<b>${esc(title)}</b>${list.slice().sort((a,b)=>a.pos-b.pos).map(o=>`${o.pos}. ${esc(o.name)}`).join(" · ")}`;tip.style.display="block";moveTip(e)}
function moveTip(e){const r=tip.getBoundingClientRect();let x=(e.clientX??0)+14,y=(e.clientY??0)+14;if(x+r.width>innerWidth-8)x=innerWidth-r.width-8;if(y+r.height>innerHeight-8)y=(e.clientY??0)-r.height-10;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.display="none"}
function group(key,map){const m=new Map();TOP.forEach(o=>{let k=o[key];if(map)k=map(k,o);if(k==null||k==="")return;if(!m.has(k))m.set(k,[]);m.get(k).push(o)});return m}
function tierLine(test,label){const t=[10,25,50,100].map(n=>{const k=TOP.slice(0,n).filter(test).length;return `top ${n}: <b>${Math.round(k/n*100)}%</b>`});return `<div class="tier">${label} — ${t.join(" · ")}</div>`}
function table(entries){return `<details><summary>Show villains</summary><table>${entries.map(([k,v])=>`<tr><td><b>${esc(k)}</b> (${v.length})</td><td>${v.map(o=>esc(o.name)).join(", ")}</td></tr>`).join("")}</table></details>`}
const DC=["var(--accent)","var(--ink)","#9a9a9a","#d4d4d4"];const DL={"Superpower":"Super","No superpower":"Not super"};const dl=k=>DL[k]||k;
const lrp=(cs)=>{const t=cs.reduce((a,b)=>a+b,0)||1;const raw=cs.map(c=>c/t*100);const fl=raw.map(Math.floor);let left=100-fl.reduce((a,b)=>a+b,0);raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0&&cs[i]>0){fl[i]++;left--}});return fl};
function donutSVG(e){const tot=e.reduce((a,x)=>a+x[1].length,0);const r=54,C=2*Math.PI*r;let off=0;const P=lrp(e.map(x=>x[1].length));const pc=c=>{const i=e.findIndex(x=>x[1].length===c);return P[i]+"%"};
  const arcs=e.map(([k,v],i)=>{const len=v.length/tot*C;const gap=e.length>1?Math.min(2,len/2):0;const a=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${DC[i%DC.length]}" stroke-width="22" stroke-dasharray="${Math.max(len-gap,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return a}).join("");
  return `<div class="dwrap"><svg viewBox="0 0 140 140" class="dsvg" role="img" aria-label="${e.map(([k,v],i)=>esc(dl(k))+' '+P[i]+'%').join(', ')}">${arcs}<text x="70" y="70" text-anchor="middle" class="dbig">${P[0]}%</text><text x="70" y="90" text-anchor="middle" class="dsm" style="font-size:${Math.min(9.5,72/dl(e[0][0]).length)}px">${esc(dl(e[0][0])).toUpperCase()}</text></svg><ul class="dleg">${e.map(([k,v],i)=>`<li><i style="background:${DC[i%DC.length]}"></i>${esc(dl(k))}<b>${P[i]}%</b></li>`).join("")}</ul></div>`}
function hbar(id,title,sub,m,opt={}){
  let e=[...m.entries()].sort((a,b)=>b[1].length-a[1].length||String(a[0]).localeCompare(String(b[0])));
  if(opt.minOther){const big=e.filter(x=>x[1].length>=opt.minOther),small=e.filter(x=>x[1].length<opt.minOther);if(small.length>1){e=big;opt.otherNote=`${small.length} more with one each: `+small.map(x=>x[0]).join(", ")+".";opt.smallE=small}}
  const max=Math.max(...e.map(x=>x[1].length));
  const el=document.createElement("div");el.className="chart";
  el.innerHTML=(opt.donut||e.length===2)?`<h3>${title}</h3>${donutSVG(e)}${table(e)}`:`<h3>${title}</h3><div class="hb">${e.map(([k,v],i)=>`<div class="row"><div class="lab">${esc(k)}</div><div class="trk" tabindex="0" data-i="${i}" aria-label="${esc(k)}: ${v.length}"><i class="${v.length===max?"hi":""}" style="width:${(v.length/max*100).toFixed(1)}%"></i></div><div class="v">${v.length}</div></div>`).join("")}</div>${table(e.concat(opt.smallE||[]))}`;
  el.querySelectorAll(".trk").forEach(t=>{const [k,v]=e[+t.dataset.i];t.addEventListener("mouseenter",ev=>showTip(ev,`${k}: ${v.length}`,v));t.addEventListener("mousemove",moveTip);t.addEventListener("mouseleave",hideTip);t.addEventListener("focus",()=>{const r=t.getBoundingClientRect();showTip({clientX:r.left,clientY:r.bottom},`${k}: ${v.length}`,v)});t.addEventListener("blur",hideTip)});
  document.getElementById("viz").appendChild(el);
}
function cols(title,sub){
  const m=group("year",y=>Math.floor(y/10)*10);const ds=[];for(let d=1930;d<=2010;d+=10)ds.push(d);
  const max=Math.max(...ds.map(d=>(m.get(d)||[]).length));
  const el=document.createElement("div");el.className="chart";
  el.innerHTML=`<h3>${title}</h3><div class="cols">${ds.map(d=>{const v=m.get(d)||[];return `<div class="c" tabindex="0" data-d="${d}" aria-label="${d}s: ${v.length}"><span>${v.length||""}</span><i class="${v.length===max?"hi":""}" style="height:${(v.length/max*100).toFixed(1)}%"></i></div>`}).join("")}</div><div class="clabs">${ds.map(d=>`<span>${String(d).slice(2)}s</span>`).join("")}</div>`
   +table(ds.filter(d=>m.get(d)).map(d=>[d+"s",m.get(d).sort((a,b)=>a.year-b.year)]));
  el.querySelectorAll(".c").forEach(c=>{const d=+c.dataset.d,v=(m.get(d)||[]);c.addEventListener("mouseenter",ev=>showTip(ev,`${d}s: ${v.length}`,v));c.addEventListener("mousemove",moveTip);c.addEventListener("mouseleave",hideTip)});
  document.getElementById("viz").appendChild(el);
}
hbar("g","Gender","",group("gender"),{donut:true,order:["Male","Female","None","Male and female"],extra:tierLine(o=>o.gender==="Female","Female share")});
hbar("s","Species","",group("species"),{extra:tierLine(o=>o.species==="Human","Human share")});
cols("Date of release","");
hbar("f","Franchise or standalone","",group("franchise",k=>k?"Franchise":"Standalone"),{extra:tierLine(o=>!!o.franchise,"Franchise share")});
hbar("fr","Franchises","",group("franchise"),{minOther:2});
hbar("st","Studio","",group("studio",k=>PAR[k]||k),{minOther:2});
hbar("ge","Genre","",group("genre"),{flag:true});
hbar("ar","Archetype","",group("archetype"),{flag:true});
hbar("k","Killer or not","",group("killer"),{order:["Killer","Not a killer"],extra:tierLine(o=>o.killer==="Killer","Killer share")});
hbar("pw","Superpower or not","",group("power"),{order:["Superpower","No superpower"],extra:tierLine(o=>o.power==="Superpower","Superpower share")});

render();
</script>
